# analysis_rules.yaml — Single source of truth for every analytic rule.
#
# All values are TBD until the corresponding ADR is written and approved by Azam.
# Each key cites its ADR. The pipeline raises ValueError if any value is TBD.
# Benchmarks are cited from primary literature — citations confirmed during Phase 04.

# ─────────────────────────────────────────────────────────────────────────────
# ADR-001: Tooling
# ─────────────────────────────────────────────────────────────────────────────
tooling:
  engine: duckdb+pandas  # DuckDB SQL for transforms; pandas for output formatting only

# ─────────────────────────────────────────────────────────────────────────────
# ADR-002: Eligibility criteria
# ─────────────────────────────────────────────────────────────────────────────
eligibility:
  require_breast_code: true       # only C50.x counts toward breast cancer eligibility
  min_age_at_index_years: 18      # age at metastatic index date (ASCO adult oncology standard)
  valid_dob_required: true        # exclude patients flagged death_before_birth
  must_exist_in_patient: true     # exclude orphan IDs not in patient table

# ─────────────────────────────────────────────────────────────────────────────
# ADR-003: Handling future-dated, post-death, and pre-birth records
# ─────────────────────────────────────────────────────────────────────────────
dq:
  future_date_action: flag        # flag and exclude downstream; do not silently drop
  post_death_action: flag         # flag; grace period applies (post_death_grace_days)
  pre_birth_action: flag          # flag; patient excluded from cohort in cohort.py
  post_death_grace_days: 30       # admin/lab lag — events within 30 days post-death are kept
  curation_priority: curated_first  # prefer curation_flag=1; fall back to flag=0 if no curated record exists

# ─────────────────────────────────────────────────────────────────────────────
# ADR-004: Metastatic index date definition and source priority
# ─────────────────────────────────────────────────────────────────────────────
index_date:
  source_priority: earliest_of_diagnosis_and_staging  # MIN(C50 met dx date, M1/IV staging date)
  require_c50_for_diagnosis: true  # non-C50 metastatic codes excluded from diagnosis source

# ─────────────────────────────────────────────────────────────────────────────
# ADR-005: De novo vs recurrent definition
# ─────────────────────────────────────────────────────────────────────────────
cohort:
  de_novo_primary_gap_days: 180  # gap <= 180d from primary to metastatic index = de novo; no prior primary = de novo

# ─────────────────────────────────────────────────────────────────────────────
# ADR-006: HER2 variant → category mapping
# ─────────────────────────────────────────────────────────────────────────────
her2:
  variant_to_category:
    # HER2-positive (ASCO/CAP 2018/2023): IHC 3+ or IHC 2+/ISH amplified
    "IHC 3+": "positive"
    "IHC 2+; ISH amplified": "positive"
    # HER2-low (ASCO/CAP 2023): IHC 1+ or IHC 2+/ISH non-amplified
    "IHC 1+": "low"
    "IHC 2+; ISH negative": "low"
    # HER2-ultralow (DESTINY-Breast06): IHC 0 with faint staining in <=10% cells
    "IHC 0 with faint membrane staining in <=10% cells": "ultralow"
    # HER2-null: IHC 0 with no staining documented
    "IHC 0 absent membrane staining": "null"
    "IHC 0": "null"                # no faint-staining qualifier → absent staining assumed
    # Unknown: cannot assign category
    "IHC 0 with membrane staining": "unknown"  # staining present but % not documented
    "IHC equivocal": "unknown"
    "Pending": "unknown"

# ─────────────────────────────────────────────────────────────────────────────
# ADR-007: HER2 look-up window
# ─────────────────────────────────────────────────────────────────────────────
  window_days:
    pre_index: 365   # days before index date — captures primary workup biomarkers
    post_index: 90   # days after index date — confirmatory tests at staging

# ─────────────────────────────────────────────────────────────────────────────
# ADR-008: HER2 tie-break hierarchy
# ─────────────────────────────────────────────────────────────────────────────
  tiebreak_order:
    - curation_flag        # curated (flag=1) beats uncurated (flag=0)
    - variant_specificity  # non-NULL variant beats NULL; more granular beats less
    - closest_to_index     # closest report_date to metastatic index date wins
  conflict_resolution: variant_beats_result_text  # IHC score overrides Positive/Negative label

# ─────────────────────────────────────────────────────────────────────────────
# ADR-009: HR derivation
# ─────────────────────────────────────────────────────────────────────────────
hr:
  positive_threshold_pct: 1         # ≥1% = HR-positive (ASCO/CAP 2020)
  er_low_max_pct: 10                 # ER 1–10% = ER-low flag (ASCO/CAP 2020)
  pct_beats_result_text: true        # numeric % from variant field overrides result text
  null_variant_fallback: result_text # NULL variant → use biomarker_result (Positive/Negative)

# ─────────────────────────────────────────────────────────────────────────────
# ADR-010: Regimen grouping and line-of-therapy approximation
# ─────────────────────────────────────────────────────────────────────────────
treatment:
  regimen_window_days: 28   # drugs starting within 28 days of each other = one regimen (one chemo cycle)
  new_line_gap_days: 90     # gap > 90 days from prev regimen start = new line (Flatiron/ASCO RWD standard)
  enhertu_generic_name: "trastuzumab deruxtecan"
  # Drug class map: med_generic_name → class used in drug_classes column of patient_lines.csv
  drug_class_map:
    "trastuzumab deruxtecan": "her2_adc"
    "ado-trastuzumab emtansine": "her2_adc"
    "trastuzumab": "her2_mab"
    "pertuzumab": "her2_mab"
    "tucatinib": "her2_tki"
    "palbociclib": "cdk46i"
    "abemaciclib": "cdk46i"
    "ribociclib": "cdk46i"
    "anastrozole": "endocrine"
    "letrozole": "endocrine"
    "fulvestrant": "endocrine"
    "paclitaxel": "chemo"
    "nab-paclitaxel": "chemo"
    "capecitabine": "chemo"
    "sacituzumab govitecan": "trop2_adc"

# ─────────────────────────────────────────────────────────────────────────────
# ADR-011: Subindication framework
# ─────────────────────────────────────────────────────────────────────────────
subindications:
  # Named clinical groups mapping to trial populations (ADR-011)
  required:
    - her2_positive        # DB-03 (2L+); DB-09 T-DXd+pertuzumab 1L approved Dec 15 2025
    - hr_pos_her2_low      # DB-04 (2L+); DB-06 after ≥1 ET approved Jan 27 2025
    - hr_neg_her2_low      # DB-04 (2L+)
    - hr_pos_her2_ultralow # DB-06 after ≥1 ET approved Jan 27 2025
  exploratory:
    - her2_null            # no current Enhertu indication
    - her2_unknown         # HER2 not tested — cannot confirm label compliance

# ─────────────────────────────────────────────────────────────────────────────
# ADR-012: Statistics
# ─────────────────────────────────────────────────────────────────────────────
stats:
  ci_method: wilson           # Wilson score interval — exact, works for small n, no 0/1 singularity
  ci_z: 1.96                  # 95% two-sided CI
  small_cell_threshold: 11    # n < 11 displayed as "n<11" per standard RWD reporting

# ─────────────────────────────────────────────────────────────────────────────
# ADR-013: Discordance definitions
# ─────────────────────────────────────────────────────────────────────────────
discordance:
  # Scenarios flagged as potential off-label or investigational use (ADR-013)
  definitions:
    - enhertu_in_her2_unknown  # Enhertu given with no HER2 test in window — cannot confirm label
    - enhertu_in_line_1        # Enhertu as 1L therapy — DB-09 approved Dec 15 2025 (HER2+); reframed as commercial monitoring signal

# ─────────────────────────────────────────────────────────────────────────────
# ADR-014: Literature benchmarks (citations confirmed Phase 04)
# ─────────────────────────────────────────────────────────────────────────────
benchmarks:
  # Proportions 1-3 expressed as % of CLASSIFIABLE patients (positive + low + ultralow + null).
  # Proportion 4 expressed as % of HER2-zero (null + ultralow) — different denominator.
  # Unknown HER2 patients are excluded from all benchmark denominators.
  her2_positive_pct_range: [15, 20]    # Tarantino et al. JCO 2020 (38:1951-62); SEER mBC subtypes
  her2_low_pct_range: [45, 55]         # Schettini et al. NPJ Breast Cancer 2021 (7:103); Modi et al. NEJM 2022
  her2_zero_pct_range: [25, 35]        # HER2-zero total (null+ultralow combined); complement of pos+low
  hr_positive_pct_range: [65, 75]      # SEER Cancer Stat Facts: Female Breast Cancer Subtypes
  her2_ultralow_of_zero_pct: [35, 50]  # Curigliano et al. NEJM 2024 (DB-06) rescoring of IHC-0 cases
  source_citation: "Tarantino et al. JCO 2020 (38:1951-62); Schettini et al. NPJ Breast Cancer 2021 (7:103); Modi et al. NEJM 2022; Curigliano et al. NEJM 2024 (DB-06)"

# ─────────────────────────────────────────────────────────────────────────────
# Reports: PPTX rebuild guard
# ─────────────────────────────────────────────────────────────────────────────
reports:
  rebuild_pptx: false   # Set to true only when a full PPTX regeneration is wanted.
                        # false = pipeline skips PPTX and preserves manual layout edits.
