# analysis_rules.yaml — Single source of truth for every analytic rule.
#
# All values are TBD until the corresponding ADR is written and approved by Azam.
# Each key cites its ADR. The pipeline raises ValueError if any value is TBD.
# Benchmarks are marked VERIFY — do not state them as fact without a citation.

# ─────────────────────────────────────────────────────────────────────────────
# ADR-001: Tooling
# ─────────────────────────────────────────────────────────────────────────────
tooling:
  engine: duckdb+pandas  # DuckDB SQL for transforms; pandas for output formatting only

# ─────────────────────────────────────────────────────────────────────────────
# ADR-002: Eligibility criteria
# ─────────────────────────────────────────────────────────────────────────────
eligibility:
  require_breast_code: true       # only C50.x counts toward breast cancer eligibility
  min_age_at_index_years: 18      # age at metastatic index date (ASCO adult oncology standard)
  valid_dob_required: true        # exclude patients flagged death_before_birth
  must_exist_in_patient: true     # exclude orphan IDs not in patient table

# ─────────────────────────────────────────────────────────────────────────────
# ADR-003: Handling future-dated, post-death, and pre-birth records
# ─────────────────────────────────────────────────────────────────────────────
dq:
  future_date_action: flag        # flag and exclude downstream; do not silently drop
  post_death_action: flag         # flag; grace period applies (post_death_grace_days)
  pre_birth_action: flag          # flag; patient excluded from cohort in cohort.py
  post_death_grace_days: 30       # admin/lab lag — events within 30 days post-death are kept
  curation_priority: curated_first  # prefer curation_flag=1; fall back to flag=0 if no curated record exists

# ─────────────────────────────────────────────────────────────────────────────
# ADR-004: Metastatic index date definition and source priority
# ─────────────────────────────────────────────────────────────────────────────
index_date:
  source_priority: earliest_of_diagnosis_and_staging  # MIN(C50 met dx date, M1/IV staging date)
  require_c50_for_diagnosis: true  # non-C50 metastatic codes excluded from diagnosis source

# ─────────────────────────────────────────────────────────────────────────────
# ADR-005: De novo vs recurrent definition
# ─────────────────────────────────────────────────────────────────────────────
cohort:
  de_novo_primary_gap_days: 180  # gap <= 180d from primary to metastatic index = de novo; no prior primary = de novo

# ─────────────────────────────────────────────────────────────────────────────
# ADR-006: HER2 variant → category mapping
# ─────────────────────────────────────────────────────────────────────────────
her2:
  variant_to_category:
    ihc_3plus: TBD                        # IHC 3+
    ihc_2plus_ish_amplified: TBD          # IHC 2+; ISH amplified
    ihc_2plus_ish_negative: TBD           # IHC 2+; ISH negative
    ihc_1plus: TBD                        # IHC 1+
    ihc_0_absent_membrane: TBD            # IHC 0 absent membrane staining
    ihc_0_faint_membrane_lte10pct: TBD    # IHC 0 with faint membrane staining in <=10% cells
    ihc_0_membrane_staining: TBD          # IHC 0 with membrane staining (% not stated — ambiguous)
    ihc_0_no_detail: TBD                  # IHC 0 (no staining detail — unresolvable)
    equivocal_or_pending_or_blank: TBD    # equivocal / Pending / blank + Unknown result

# ─────────────────────────────────────────────────────────────────────────────
# ADR-007: HER2 look-up window
# ─────────────────────────────────────────────────────────────────────────────
  window_days:
    pre_index: 365   # days before index date — captures primary workup biomarkers
    post_index: 90   # days after index date — confirmatory tests at staging

# ─────────────────────────────────────────────────────────────────────────────
# ADR-008: HER2 tie-break hierarchy
# ─────────────────────────────────────────────────────────────────────────────
  tiebreak_order:
    - curation_flag        # curated (flag=1) beats uncurated (flag=0)
    - variant_specificity  # non-NULL variant beats NULL; more granular beats less
    - closest_to_index     # closest report_date to metastatic index date wins
  conflict_resolution: variant_beats_result_text  # IHC score overrides Positive/Negative label

# ─────────────────────────────────────────────────────────────────────────────
# ADR-009: HR derivation
# ─────────────────────────────────────────────────────────────────────────────
hr:
  positive_threshold_pct: 1         # ≥1% = HR-positive (ASCO/CAP 2020)
  er_low_max_pct: 10                 # ER 1–10% = ER-low flag (ASCO/CAP 2020)
  pct_beats_result_text: true        # numeric % from variant field overrides result text
  null_variant_fallback: result_text # NULL variant → use biomarker_result (Positive/Negative)

# ─────────────────────────────────────────────────────────────────────────────
# ADR-010: Regimen grouping and line-of-therapy approximation
# ─────────────────────────────────────────────────────────────────────────────
treatment:
  regimen_window_days: TBD  # drugs starting within N days of each other = one regimen
  new_line_gap_days: TBD    # gap > N days before a new drug class = new line

# ─────────────────────────────────────────────────────────────────────────────
# ADR-011: Subindication framework
# ─────────────────────────────────────────────────────────────────────────────
subindications:
  required: TBD     # e.g. [her2_positive, hr_pos_her2_low, hr_pos_her2_ultralow]
  exploratory: TBD  # e.g. [hr_neg_her2_low, her2_null, unknown]

# ─────────────────────────────────────────────────────────────────────────────
# ADR-012: Statistics
# ─────────────────────────────────────────────────────────────────────────────
stats:
  ci_method: TBD              # wilson
  small_cell_threshold: TBD   # cells with n < this are displayed as "n<11"

# ─────────────────────────────────────────────────────────────────────────────
# ADR-013: Discordance definitions
# ─────────────────────────────────────────────────────────────────────────────
discordance:
  definitions: TBD  # list of named rules, e.g.:
                    # - enhertu_in_her2_null
                    # - her2_targeted_in_her2_negative
                    # - cdk46i_in_hr_negative
                    # - enhertu_before_endocrine_in_hr_pos
                    # - enhertu_before_her2_test_date

# ─────────────────────────────────────────────────────────────────────────────
# ADR-014: Literature benchmarks (VERIFY ALL — do not state as fact without citation)
# ─────────────────────────────────────────────────────────────────────────────
benchmarks:
  her2_positive_pct_range: TBD    # VERIFY — approximate: [15, 20]
  her2_low_pct_range: TBD         # VERIFY — approximate: [45, 55]
  her2_null_pct_range: TBD        # VERIFY — approximate: [25, 35]
  hr_positive_pct_range: TBD      # VERIFY — approximate: [65, 75]
  her2_ultralow_of_null_pct: TBD  # VERIFY — approximate: [20, 30] (from DB-06 screening)
  source_citation: TBD            # VERIFY — cite the paper(s)
